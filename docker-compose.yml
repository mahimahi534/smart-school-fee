services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_school_fee_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mysql://smart_user:smart_password@db:3306/smart_school_fee
      - JWT_SECRET=smart_school_fee_production_secret_key_at_least_32_characters_2026
      - REFRESH_TOKEN_SECRET=smart_school_fee_refresh_secret_production_key_2026
      - ADMIN_SETUP_SECRET=SmartSchoolAdminSetup2026!
      - CLIENT_ORIGIN=http://localhost:5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: smart_school_fee_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_production_password
      MYSQL_DATABASE: smart_school_fee
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: smart_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
